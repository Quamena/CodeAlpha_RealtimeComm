<!DOCTYPE html>
<html>
<head>
    <title>Call Room: {{ room_name }}</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #121212;
            color: #eee;
            margin: 0;
            padding: 20px;

        h1 {
            font-size: 18px;

            color: #aaa;

        }

        h1 span {
            color: #fff;

        }

        #controls {
            margin-bottom: 15px;

        #enableSound {
            display: none;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;

        }

        #enableSound:hover {

        }

        #videoGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

        #status {
            margin-top: 16px;

        #log {
            margin-top: 10px;

            max-height: 180px;
            overflow-y: auto;
        }

        #log p {

</head>

<body>

<h1>
    Room: <span>{{ room_name }}</span>
</h1>

<div id="controls">
    <button id="enableSound">
        Enable sound
    </button>
</div>

<div id="videoGrid">

    <div class="tile" id="tile-local">
        <video
            id="localVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="label">You</div>
    </div>

</div>

<div id="status">Connecting...</div>

<div id="log"></div>


<script>

    // ============================================================
    // ROOM / WEBSOCKET
    // ============================================================

    const roomName = "{{ room_name }}";

    const wsProtocol =
        window.location.protocol === "https:"
            ? "wss://"
            : "ws://";

    const callSocket = new WebSocket(
        wsProtocol +
        window.location.host +
        "/ws/call/" +
        roomName +
        "/"
    );


    // ============================================================
    // LOGGING
    // ============================================================

    function log(message) {

        console.log(message);

        const p = document.createElement("p");

        p.textContent = message;

        document
            .getElementById("log")
            .appendChild(p);

        const logBox =
            document.getElementById("log");

        logBox.scrollTop =
            logBox.scrollHeight;
    }


    function setStatus(message) {

        document
            .getElementById("status")
            .textContent = message;

    }


    // ============================================================
    // LOCAL MEDIA
    // ============================================================

    let localStream = null;


    // peerId -> RTCPeerConnection
    const peerConnections = {};


    // ICE candidates received before remote description
    const pendingCandidates = {};


    // ============================================================
    // ICE SERVERS
    // ============================================================

    const iceServers = {

        iceServers: [

            {
                urls: "stun:stun.l.google.com:19302"
            },

            {
                urls: "turn:openrelay.metered.ca:80",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject"
            }

        ],

        iceCandidatePoolSize: 10
    };


    // ============================================================
    // SOUND BUTTON
    // ============================================================

    const enableSoundButton =
        document.getElementById("enableSound");


    enableSoundButton.addEventListener(
        "click",
        async () => {

            const videos =
                document.querySelectorAll(
                    "#videoGrid video"
                );


            for (const video of videos) {

                if (video.id === "localVideo") {
                    continue;
                }

                video.muted = false;

                try {

                    await video.play();

                }

                catch (error) {

                    console.error(
                        "Could not start remote video:",
                        error
                    );

                }

            }


            enableSoundButton.style.display =
                "none";

            log("Remote sound enabled.");

        }
    );


    // ============================================================
    // START CAMERA + MICROPHONE
    // ============================================================

    async function startMedia() {

        try {

            log(
                "Requesting camera and microphone..."
            );


            localStream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });


            const localVideo =
                document.getElementById(
                    "localVideo"
                );


            localVideo.srcObject =
                localStream;


            await localVideo.play();


            log(
                "Camera and microphone ready."
            );


            log(
                "Local video tracks: " +
                localStream.getVideoTracks().length
            );


            log(
                "Local audio tracks: " +
                localStream.getAudioTracks().length
            );


            setStatus(
                "Camera and microphone ready. Waiting for another person..."
            );

        }

        catch (error) {

            console.error(error);


            log(
                "ERROR: Could not access camera/microphone: " +
                error.message
            );


            setStatus(
                "Camera/microphone access failed."
            );

        }

    }


    // ============================================================
    // WAIT FOR LOCAL STREAM
    // ============================================================

    function waitForLocalStream() {

        return new Promise((resolve) => {

            if (localStream) {

                resolve();

                return;

            }


            const check =
                setInterval(() => {

                    if (localStream) {

                        clearInterval(check);

                        resolve();

                    }

                }, 100);

        });

    }


    // ============================================================
    // ADD REMOTE VIDEO TILE
    // ============================================================

    function addTile(peerId) {

        const existing =
            document.getElementById(
                "tile-" + peerId
            );


        if (existing) {

            return;

        }


        const tile =
            document.createElement("div");


        tile.className = "tile";

        tile.id =
            "tile-" + peerId;


        const video =
            document.createElement("video");


        video.id =
            "video-" + peerId;

        video.autoplay = true;

        video.playsInline = true;

        video.controls = false;

        /*
         * Start muted because browsers can block
         * autoplay with sound.
         *
         * The user can click "Enable sound".
         */
        video.muted = true;


        const label =
            document.createElement("div");


        label.className = "label";

        label.textContent =
            peerId.slice(0, 8);


        tile.appendChild(video);

        tile.appendChild(label);


        document
            .getElementById("videoGrid")
            .appendChild(tile);


        return video;

    }


    // ============================================================
    // REMOVE REMOTE VIDEO TILE
    // ============================================================

    function removeTile(peerId) {

        const tile =
            document.getElementById(
                "tile-" + peerId
            );


        if (tile) {

            tile.remove();

        }

    }


    // ============================================================
    // CREATE PEER CONNECTION
    // ============================================================

    function createPeerConnection(peerId) {

        /*
         * If an existing connection is healthy,
         * reuse it.
         */

        if (peerConnections[peerId]) {

            const existing =
                peerConnections[peerId];


            if (
                existing.connectionState !== "failed" &&
                existing.connectionState !== "closed"
            ) {

                log(
                    "Using existing connection for peer " +
                    peerId.slice(0, 8)
                );

                return existing;

            }


            /*
             * Remove failed connection.
             */

            try {

                existing.close();

            }

            catch (error) {

                console.error(error);

            }


            delete peerConnections[peerId];

        }


        log(
            "Creating NEW WebRTC connection for peer " +
            peerId.slice(0, 8)
        );


        const pc =
            new RTCPeerConnection(
                iceServers
            );


        // ========================================================
        // ADD LOCAL AUDIO + VIDEO
        // ========================================================

        if (localStream) {

            localStream
                .getTracks()
                .forEach((track) => {

                    log(
                        "Adding local " +
                        track.kind +
                        " track."
                    );


                    pc.addTrack(
                        track,
                        localStream
                    );

                });

        }


        // ========================================================
        // RECEIVE REMOTE AUDIO + VIDEO
        // ========================================================

        pc.ontrack = async (event) => {

            console.log(
                "REMOTE TRACK RECEIVED:",
                event.track.kind
            );


            log(
                "Remote " +
                event.track.kind +
                " track received from " +
                peerId.slice(0, 8)
            );


            let video =
                document.getElementById(
                    "video-" + peerId
                );


            if (!video) {

                video =
                    addTile(peerId);

            }


            if (
                event.streams &&
                event.streams.length > 0
            ) {

                const remoteStream =
                    event.streams[0];


                video.srcObject =
                    remoteStream;


                log(
                    "Remote stream attached. " +
                    "Video tracks: " +
                    remoteStream.getVideoTracks().length +
                    ", Audio tracks: " +
                    remoteStream.getAudioTracks().length
                );

            }


            /*
             * Keep video muted initially so the browser
             * allows autoplay.
             */

            video.muted = true;


            try {

                await video.play();


                log(
                    "Remote video is playing."
                );


                /*
                 * Show sound button so the user can
                 * enable remote audio after interaction.
                 */

                enableSoundButton.style.display =
                    "inline-block";

            }

            catch (error) {

                console.error(
                    "Remote video play error:",
                    error
                );


                log(
                    "Remote video needs user interaction to play."
                );


                enableSoundButton.style.display =
                    "inline-block";

            }

        };


        // ========================================================
        // ICE CANDIDATES
        // ========================================================

        pc.onicecandidate = (event) => {

            if (!event.candidate) {

                log(
                    "ICE gathering complete for peer " +
                    peerId.slice(0, 8)
                );

                return;

            }


            const candidate =
                event.candidate;


            console.log(
                "Sending ICE candidate:",
                candidate.candidate
            );


            /*
             * Show what type of candidate we have.
             *
             * host   = local network
             * srflx  = STUN discovered address
             * relay  = TURN server
             */

            if (
                candidate.candidate
            ) {

                if (
                    candidate.candidate.includes("typ relay")
                ) {

                    log(
                        "TURN relay candidate found."
                    );

                }

                else if (
                    candidate.candidate.includes("typ srflx")
                ) {

                    log(
                        "STUN server-reflexive candidate found."
                    );

                }

            }


            if (
                callSocket.readyState !==
                WebSocket.OPEN
            ) {

                log(
                    "WebSocket not ready; ICE candidate not sent."
                );

                return;

            }


            callSocket.send(
                JSON.stringify({

                    type: "ice-candidate",

                    candidate: candidate,

                    target: peerId

                })
            );

        };


        // ========================================================
        // CONNECTION STATE
        // ========================================================

        pc.onconnectionstatechange = async () => {

            const state =
                pc.connectionState;


            log(
                "Peer " +
                peerId.slice(0, 8) +
                ": " +
                state
            );


            if (state === "connected") {

                setStatus(
                    "Connected to " +
                    peerId.slice(0, 8)
                );

            }


            if (state === "disconnected") {

                log(
                    "WebRTC temporarily disconnected."
                );

            }


            if (state === "failed") {

                log(
                    "WebRTC connection failed. Attempting ICE restart..."
                );


                /*
                 * Try to recover once.
                 */

                try {

                    if (
                        pc.signalingState === "stable"
                    ) {

                        const offer =
                            await pc.createOffer({
                                iceRestart: true
                            });


                        await pc.setLocalDescription(
                            offer
                        );


                        callSocket.send(
                            JSON.stringify({

                                type: "offer",

                                sdp:
                                    pc.localDescription,

                                target:
                                    peerId

                            })
                        );


                        log(
                            "ICE restart offer sent."
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "ICE restart failed:",
                        error
                    );


                    log(
                        "ICE restart error: " +
                        error.message
                    );

                }

            }


            if (state === "closed") {

                closePeer(
                    peerId
                );

            }

        };


        // ========================================================
        // ICE CONNECTION STATE
        // ========================================================

        pc.oniceconnectionstatechange = () => {

            const state =
                pc.iceConnectionState;


            console.log(
                "ICE state:",
                state
            );


            log(
                "ICE connection: " +
                state
            );


            if (state === "connected") {

                setStatus(
                    "WebRTC connected."
                );

            }


            if (state === "completed") {

                setStatus(
                    "WebRTC connection established."
                );

            }


            if (state === "failed") {

                log(
                    "ICE failed. TURN may be required."
                );

            }

        };


        // ========================================================
        // ICE GATHERING STATE
        // ========================================================

        pc.onicegatheringstatechange = () => {

            log(
                "ICE gathering: " +
                pc.iceGatheringState
            );

        };


        // ========================================================
        // SIGNALING STATE
        // ========================================================

        pc.onsignalingstatechange = () => {

            console.log(
                "Signaling state:",
                pc.signalingState
            );

        };


        // Save connection

        peerConnections[peerId] =
            pc;


        return pc;

    }


    // ============================================================
    // CLOSE PEER
    // ============================================================

    function closePeer(peerId) {

        const pc =
            peerConnections[peerId];


        if (pc) {

            try {

                pc.close();

            }

            catch (error) {

                console.error(error);

            }


            delete peerConnections[peerId];

        }


        delete pendingCandidates[
            peerId
        ];


        removeTile(
            peerId
        );

    }


    // ============================================================
    // CREATE OFFER
    // ============================================================

    async function makeOfferTo(peerId) {

        try {

            const pc =
                createPeerConnection(
                    peerId
                );


            if (
                pc.signalingState !==
                "stable"
            ) {

                log(
                    "Skipping offer because connection is already negotiating."
                );

                return;

            }


            log(
                "Creating offer for " +
                peerId.slice(0, 8)
            );


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            callSocket.send(
                JSON.stringify({

                    type: "offer",

                    sdp:
                        pc.localDescription,

                    target:
                        peerId

                })
            );


            log(
                "Offer sent to " +
                peerId.slice(0, 8)
            );

        }

        catch (error) {

            console.error(
                "Offer error:",
                error
            );


            log(
                "Offer error: " +
                error.message
            );

        }

    }


    // ============================================================
    // WEBSOCKET OPEN
    // ============================================================

    callSocket.onopen = async () => {

        log(
            "WebSocket connected."
        );


        setStatus(
            "Starting camera and microphone..."
        );


        await startMedia();

    };


    // ============================================================
    // RECEIVE SIGNALING MESSAGE
    // ============================================================

    callSocket.onmessage = async (event) => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            const peerId =
                data.sender;


            if (!peerId) {

                return;

            }


            await waitForLocalStream();


            log(
                "Received: " +
                data.type +
                " from " +
                peerId.slice(0, 8)
            );


            // ====================================================
            // PEER JOINED
            // ====================================================

            if (
                data.type ===
                "peer-joined"
            ) {

                await makeOfferTo(
                    peerId
                );

            }


            // ====================================================
            // OFFER
            // ====================================================

            else if (
                data.type ===
                "offer"
            ) {

                let pc =
                    peerConnections[
                        peerId
                    ];


                /*
                 * If the connection does not exist,
                 * create it.
                 */

                if (!pc) {

                    pc =
                        createPeerConnection(
                            peerId
                        );

                }


                /*
                 * Ignore duplicate offers if we're
                 * already waiting for an answer.
                 */

                if (
                    pc.signalingState ===
                    "have-local-offer"
                ) {

                    log(
                        "Ignoring duplicate offer from " +
                        peerId.slice(0, 8)
                    );

                    return;

                }


                if (
                    pc.signalingState !==
                    "stable"
                ) {

                    log(
                        "Ignoring offer because signaling state is " +
                        pc.signalingState
                    );

                    return;

                }


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.sdp
                    )
                );


                log(
                    "Remote offer applied."
                );


                /*
                 * Add ICE candidates that arrived
                 * before the remote description.
                 */

                if (
                    pendingCandidates[peerId]
                ) {

                    for (
                        const candidate
                        of pendingCandidates[peerId]
                    ) {

                        try {

                            await pc.addIceCandidate(
                                candidate
                            );

                        }

                        catch (error) {

                            console.error(
                                "ICE candidate error:",
                                error
                            );

                        }

                    }


                    delete pendingCandidates[
                        peerId
                    ];

                }


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                callSocket.send(
                    JSON.stringify({

                        type: "answer",

                        sdp:
                            pc.localDescription,

                        target:
                            peerId

                    })
                );


                log(
                    "Answer sent to " +
                    peerId.slice(0, 8)
                );

            }


            // ====================================================
            // ANSWER
            // ====================================================

            else if (
                data.type ===
                "answer"
            ) {

                const pc =
                    peerConnections[
                        peerId
                    ];


                if (!pc) {

                    log(
                        "No peer connection found for answer."
                    );

                    return;

                }


                if (
                    pc.signalingState !==
                    "have-local-offer"
                ) {

                    log(
                        "Ignoring answer because connection is not waiting for an answer."
                    );

                    return;

                }


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.sdp
                    )
                );


                log(
                    "Remote answer applied."
                );


                /*
                 * Process early ICE candidates.
                 */

                if (
                    pendingCandidates[peerId]
                ) {

                    for (
                        const candidate
                        of pendingCandidates[peerId]
                    ) {

                        try {

                            await pc.addIceCandidate(
                                candidate
                            );

                        }

                        catch (error) {

                            console.error(
                                "ICE candidate error:",
                                error
                            );

                        }

                    }


                    delete pendingCandidates[
                        peerId
                    ];

                }

            }


            // ====================================================
            // ICE CANDIDATE
            // ====================================================

            else if (
                data.type ===
                "ice-candidate"
            ) {

                const candidate =
                    new RTCIceCandidate(
                        data.candidate
                    );


                const pc =
                    peerConnections[
                        peerId
                    ];


                if (
                    !pc ||
                    !pc.remoteDescription
                ) {

                    if (
                        !pendingCandidates[
                            peerId
                        ]
                    ) {

                        pendingCandidates[
                            peerId
                        ] = [];

                    }


                    pendingCandidates[
                        peerId
                    ].push(
                        candidate
                    );


                    log(
                        "Stored ICE candidate until remote description is ready."
                    );


                    return;

                }


                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                catch (error) {

                    console.error(
                        "Could not add ICE candidate:",
                        error
                    );


                    log(
                        "ICE candidate error: " +
                        error.message
                    );

                }

            }


            // ====================================================
            // PEER LEFT
            // ====================================================

            else if (
                data.type ===
                "peer-left"
            ) {

                closePeer(
                    peerId
                );


                setStatus(
                    "Peer left the call."
                );

            }

        }

        catch (error) {

            console.error(
                "WebSocket message error:",
                error
            );


            log(
                "Signaling error: " +
                error.message
            );

        }

    };


    // ============================================================
    // WEBSOCKET CLOSED
    // ============================================================

    callSocket.onclose = () => {

        log(
            "WebSocket closed."
        );


        setStatus(
            "Disconnected"
        );

    };


    // ============================================================
    // WEBSOCKET ERROR
    // ============================================================

    callSocket.onerror = (error) => {

        console.error(
            "WebSocket error:",
            error
        );


        log(
            "WebSocket error."
        );

    };

</script>

</body>
</html>
