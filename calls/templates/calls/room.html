```
<h1>
    Room: <span>{{ room_name }}</span>
</h1>

<div id="videoGrid">

    <!-- Local video -->
    <div class="tile" id="tile-local">
        <video
            id="localVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="label">You</div>
    </div>

</div>

<div id="status">Connecting…</div>

<div id="log"></div>


<script>

    // ============================================================
    // ROOM / WEBSOCKET
    // ============================================================

    const roomName = "{{ room_name }}";

    const wsProtocol =
        window.location.protocol === "https:"
            ? "wss://"
            : "ws://";

    const callSocket = new WebSocket(
        wsProtocol +
        window.location.host +
        "/ws/call/" +
        roomName +
        "/"
    );


    // ============================================================
    // LOGGING
    // ============================================================

    function log(message) {

        console.log(message);

        const p = document.createElement("p");

        p.textContent = message;

        document
            .getElementById("log")
            .appendChild(p);
    }


    function setStatus(message) {

        document
            .getElementById("status")
            .textContent = message;

    }


    // ============================================================
    // LOCAL MEDIA
    // ============================================================

    let localStream = null;


    // peerId -> RTCPeerConnection
    const peerConnections = {};


    // Store ICE candidates that arrive before remote description
    const pendingCandidates = {};


    // ============================================================
    // STUN / TURN
    // ============================================================

    const iceServers = {

        iceServers: [

            // Google STUN
            {
                urls: "stun:stun.l.google.com:19302"
            },

            // TURN
            {
                urls: "turn:openrelay.metered.ca:80",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject"
            }

        ]

    };


    // ============================================================
    // START CAMERA + MICROPHONE
    // ============================================================

    async function startMedia() {

        try {

            log("Requesting camera and microphone...");

            localStream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });


            const localVideo =
                document.getElementById("localVideo");


            localVideo.srcObject =
                localStream;


            log("Camera and microphone ready.");

            setStatus(
                "Camera ready. Waiting for others to join…"
            );

        }

        catch (error) {

            console.error(error);

            log(
                "ERROR: Could not access camera/microphone — " +
                error.message
            );

            setStatus(
                "Camera/mic access failed: " +
                error.message
            );

        }

    }


    // ============================================================
    // WAIT FOR LOCAL STREAM
    // ============================================================

    function waitForLocalStream() {

        return new Promise((resolve) => {

            if (localStream) {

                resolve();

                return;

            }


            const check =
                setInterval(() => {

                    if (localStream) {

                        clearInterval(check);

                        resolve();

                    }

                }, 100);

        });

    }


    // ============================================================
    // ADD REMOTE VIDEO TILE
    // ============================================================

    function addTile(peerId) {

        const existing =
            document.getElementById(
                "tile-" + peerId
            );


        if (existing) {

            return;

        }


        const tile =
            document.createElement("div");


        tile.className = "tile";

        tile.id =
            "tile-" + peerId;


        tile.innerHTML = `

            <video
                id="video-${peerId}"
                autoplay
                playsinline>
            </video>

            <div class="label">
                ${peerId.slice(0, 8)}
            </div>

        `;


        document
            .getElementById("videoGrid")
            .appendChild(tile);

    }


    // ============================================================
    // REMOVE REMOTE VIDEO TILE
    // ============================================================

    function removeTile(peerId) {

        const tile =
            document.getElementById(
                "tile-" + peerId
            );


        if (tile) {

            tile.remove();

        }

    }


    // ============================================================
    // CREATE PEER CONNECTION
    // ============================================================

    function createPeerConnection(peerId) {


        // IMPORTANT:
        // Don't create a second connection if one already exists.

        if (peerConnections[peerId]) {

            log(
                "Using existing connection for peer " +
                peerId.slice(0, 8)
            );

            return peerConnections[peerId];

        }


        log(
            "Creating WebRTC connection for peer " +
            peerId.slice(0, 8)
        );


        const pc =
            new RTCPeerConnection(
                iceServers
            );


        // ========================================================
        // ADD OUR CAMERA + MICROPHONE
        // ========================================================

        if (localStream) {

            localStream
                .getTracks()
                .forEach((track) => {

                    console.log(
                        "Adding local track:",
                        track.kind
                    );

                    pc.addTrack(
                        track,
                        localStream
                    );

                });

        }


        // ========================================================
        // RECEIVE REMOTE CAMERA + MICROPHONE
        // ========================================================

        pc.ontrack = async (event) => {

            console.log(
                "REMOTE TRACK RECEIVED:",
                event.track.kind
            );


            log(
                "Remote " +
                event.track.kind +
                " track received from " +
                peerId.slice(0, 8)
            );


            addTile(peerId);


            const video =
                document.getElementById(
                    "video-" + peerId
                );


            if (!video) {

                console.error(
                    "Remote video element not found"
                );

                return;

            }


            // Attach remote stream
            if (event.streams && event.streams[0]) {

                video.srcObject =
                    event.streams[0];

            }


            // Make sure the video plays
            try {

                await video.play();

                log(
                    "Remote video is playing."
                );

            }

            catch (error) {

                console.error(
                    "Remote video play error:",
                    error
                );

                log(
                    "Remote video could not autoplay."
                );

            }

        };


        // ========================================================
        // ICE CANDIDATES
        // ========================================================

        pc.onicecandidate = (event) => {

            if (!event.candidate) {

                return;

            }


            console.log(
                "Sending ICE candidate:",
                event.candidate.candidate
            );


            callSocket.send(
                JSON.stringify({

                    type: "ice-candidate",

                    candidate:
                        event.candidate,

                    target:
                        peerId

                })
            );

        };


        // ========================================================
        // CONNECTION STATE
        // ========================================================

        pc.onconnectionstatechange = () => {

            log(
                "Peer " +
                peerId.slice(0, 8) +
                ": " +
                pc.connectionState
            );


            if (
                pc.connectionState === "connected"
            ) {

                setStatus(
                    "Connected to " +
                    peerId.slice(0, 8)
                );

            }


            if (
                pc.connectionState === "failed"
            ) {

                log(
                    "WebRTC connection failed."
                );

            }


            if (
                pc.connectionState === "disconnected"
            ) {

                log(
                    "WebRTC connection disconnected."
                );

            }


            if (
                pc.connectionState === "closed"
            ) {

                closePeer(peerId);

            }

        };


        // ========================================================
        // ICE CONNECTION STATE
        // ========================================================

        pc.oniceconnectionstatechange = () => {

            console.log(
                "ICE state:",
                pc.iceConnectionState
            );


            log(
                "ICE connection: " +
                pc.iceConnectionState
            );

        };


        // Save connection

        peerConnections[peerId] =
            pc;


        return pc;

    }


    // ============================================================
    // CLOSE PEER
    // ============================================================

    function closePeer(peerId) {

        const pc =
            peerConnections[peerId];


        if (pc) {

            try {

                pc.close();

            }

            catch (error) {

                console.error(error);

            }


            delete peerConnections[peerId];

        }


        delete pendingCandidates[peerId];


        removeTile(peerId);

    }


    // ============================================================
    // CREATE OFFER
    // ============================================================

    async function makeOfferTo(peerId) {

        try {

            const pc =
                createPeerConnection(peerId);


            // Don't create another offer while negotiating
            if (
                pc.signalingState !== "stable"
            ) {

                log(
                    "Skipping offer because connection is already negotiating."
                );

                return;

            }


            log(
                "Creating offer for " +
                peerId.slice(0, 8)
            );


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            callSocket.send(
                JSON.stringify({

                    type: "offer",

                    sdp:
                        pc.localDescription,

                    target:
                        peerId

                })
            );


            log(
                "Offer sent to " +
                peerId.slice(0, 8)
            );

        }

        catch (error) {

            console.error(
                "Offer error:",
                error
            );

            log(
                "Offer error: " +
                error.message
            );

        }

    }


    // ============================================================
    // WEBSOCKET OPEN
    // ============================================================

    callSocket.onopen = async () => {

        log(
            "WebSocket connected."
        );


        setStatus(
            "Connecting camera..."
        );


        await startMedia();

    };


    // ============================================================
    // RECEIVE SIGNALING MESSAGE
    // ============================================================

    callSocket.onmessage = async (event) => {

        try {

            const data =
                JSON.parse(event.data);


            const peerId =
                data.sender;


            if (!peerId) {

                return;

            }


            await waitForLocalStream();


            log(
                "Received: " +
                data.type +
                " from " +
                peerId.slice(0, 8)
            );


            // ====================================================
            // PEER JOINED
            // ====================================================

            if (
                data.type === "peer-joined"
            ) {

                await makeOfferTo(
                    peerId
                );

            }


            // ====================================================
            // OFFER
            // ====================================================

            else if (
                data.type === "offer"
            ) {

                const pc =
                    createPeerConnection(
                        peerId
                    );


                // If we're already connected,
                // don't replace the existing connection.

                if (
                    pc.signalingState !==
                    "stable" &&
                    pc.signalingState !==
                    "have-remote-offer"
                ) {

                    log(
                        "Ignoring duplicate offer from " +
                        peerId.slice(0, 8)
                    );

                    return;

                }


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.sdp
                    )
                );


                // Add any ICE candidates
                // that arrived early.

                if (
                    pendingCandidates[peerId]
                ) {

                    for (
                        const candidate
                        of pendingCandidates[peerId]
                    ) {

                        try {

                            await pc.addIceCandidate(
                                candidate
                            );

                        }

                        catch (error) {

                            console.error(
                                "ICE candidate error:",
                                error
                            );

                        }

                    }


                    delete pendingCandidates[
                        peerId
                    ];

                }


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                callSocket.send(
                    JSON.stringify({

                        type: "answer",

                        sdp:
                            pc.localDescription,

                        target:
                            peerId

                    })
                );


                log(
                    "Answer sent to " +
                    peerId.slice(0, 8)
                );

            }


            // ====================================================
            // ANSWER
            // ====================================================

            else if (
                data.type === "answer"
            ) {

                const pc =
                    peerConnections[
                        peerId
                    ];


                if (!pc) {

                    log(
                        "No peer connection found for answer."
                    );

                    return;

                }


                if (
                    pc.signalingState !==
                    "have-local-offer"
                ) {

                    log(
                        "Ignoring answer because connection is not waiting for an answer."
                    );

                    return;

                }


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.sdp
                    )
                );


                log(
                    "Remote answer applied."
                );


                // Process candidates that arrived early

                if (
                    pendingCandidates[peerId]
                ) {

                    for (
                        const candidate
                        of pendingCandidates[peerId]
                    ) {

                        try {

                            await pc.addIceCandidate(
                                candidate
                            );

                        }

                        catch (error) {

                            console.error(
                                "ICE candidate error:",
                                error
                            );

                        }

                    }


                    delete pendingCandidates[
                        peerId
                    ];

                }

            }


            // ====================================================
            // ICE CANDIDATE
            // ====================================================

            else if (
                data.type === "ice-candidate"
            ) {

                const candidate =
                    new RTCIceCandidate(
                        data.candidate
                    );


                const pc =
                    peerConnections[
                        peerId
                    ];


                if (
                    !pc ||
                    !pc.remoteDescription
                ) {

                    if (
                        !pendingCandidates[
                            peerId
                        ]
                    ) {

                        pendingCandidates[
                            peerId
                        ] = [];

                    }


                    pendingCandidates[
                        peerId
                    ].push(candidate);


                    log(
                        "Stored ICE candidate until remote description is ready."
                    );


                    return;

                }


                try {

                    await pc.addIceCandidate(
                        candidate
                    );

                }

                catch (error) {

                    console.error(
                        "Could not add ICE candidate:",
                        error
                    );

                }

            }


            // ====================================================
            // PEER LEFT
            // ====================================================

            else if (
                data.type === "peer-left"
            ) {

                closePeer(
                    peerId
                );


                setStatus(
                    "Peer left the call."
                );

            }

        }

        catch (error) {

            console.error(
                "WebSocket message error:",
                error
            );

            log(
                "Signaling error: " +
                error.message
            );

        }

    };


    // ============================================================
    // WEBSOCKET CLOSED
    // ============================================================

    callSocket.onclose = () => {

        log(
            "WebSocket closed."
        );


        setStatus(
            "Disconnected"
        );

    };


    // ============================================================
    // WEBSOCKET ERROR
    // ============================================================

    callSocket.onerror = (error) => {

        console.error(
            "WebSocket error:",
            error
        );


        log(
            "WebSocket error."
        );

    };

</script>
